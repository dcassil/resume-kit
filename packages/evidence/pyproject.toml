[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-evidence"
version = "0.0.0"
description = "Phase 4 evidence package for controlled resume alignment."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "resume-kit-core",
    "resume-kit-schemas",
]

[tool.uv.sources]
resume-kit-core = { workspace = true }
resume-kit-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_evidence"]
