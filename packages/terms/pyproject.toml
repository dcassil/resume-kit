[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-terms"
version = "0.0.0"
description = "Deterministic term normalization + synonym matching shared by the ATS and matching engines."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "resume-kit-schemas",
    "snowballstemmer>=2.2",
]

[tool.uv.sources]
resume-kit-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_terms"]
