[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-api"
version = "0.0.0"
description = "Phase 5 HTTP API transport package for Resume Kit."
requires-python = ">=3.12"
dependencies = [
    "resume-kit-facade",
    "resume-kit-feedback",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
test = [
    "httpx>=0.27",
]

[tool.uv.sources]
resume-kit-facade = { workspace = true }
resume-kit-feedback = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_api"]
