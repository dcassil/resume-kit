[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-cli"
version = "0.0.0"
description = "Phase 5 command-line transport package for Resume Kit."
requires-python = ">=3.12"
dependencies = [
    "resume-kit-facade",
    "typer>=0.12",
]

[project.scripts]
resume-tool = "resume_kit_cli.app:app"

[tool.uv.sources]
resume-kit-facade = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_cli"]
