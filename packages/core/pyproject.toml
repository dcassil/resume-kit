[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-core"
version = "0.0.0"
description = "Core package for resume evaluation, matching, and validation."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "resume-kit-schemas",
]

[tool.uv.sources]
resume-kit-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_core"]
