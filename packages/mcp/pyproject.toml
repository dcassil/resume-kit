[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-mcp"
version = "0.0.0"
description = "Phase 5 MCP transport package for Resume Kit."
requires-python = ">=3.12"
dependencies = [
    "resume-kit-facade",
    "mcp>=1",
]

[tool.uv.sources]
resume-kit-facade = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_mcp"]
