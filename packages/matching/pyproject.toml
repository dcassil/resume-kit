[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-matching"
version = "0.0.0"
description = "Phase 3 keyword matching and job recommendation package for resume evaluation."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "resume-kit-core",
    "resume-kit-schemas",
    "resume-kit-ats",
    "resume-kit-scoring",
    "resume-kit-terms",
]

[tool.uv.sources]
resume-kit-core = { workspace = true }
resume-kit-schemas = { workspace = true }
resume-kit-ats = { workspace = true }
resume-kit-scoring = { workspace = true }
resume-kit-terms = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_matching"]
