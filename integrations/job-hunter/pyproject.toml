[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-kit-job-hunter-bridge"
version = "0.0.0"
description = "Phase 5 pure-library bridge job-hunter imports; delegates to the capability facade."
requires-python = ">=3.12"
dependencies = [
    "resume-kit-core",
    "resume-kit-schemas",
    "resume-kit-facade",
]

[tool.uv.sources]
resume-kit-core = { workspace = true }
resume-kit-schemas = { workspace = true }
resume-kit-facade = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resume_kit_job_hunter_bridge"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
namespace_packages = true
