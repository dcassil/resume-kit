[project]
name = "resume-kit"
version = "0.0.0"
description = "Resume Intelligence Toolkit — evaluate, match, align, validate, and generate resume materials against jobs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Cassil" }]
keywords = ["resume", "ats", "job-matching", "mcp", "cli", "resume-tailoring"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q"
markers = [
    "eval: real-model LLM quality evals (opt-in, network + API cost)",
]
